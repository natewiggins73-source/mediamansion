<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Media Mansion</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#060a0c;color:#fff;font-family:Montserrat,system-ui,-apple-system,sans-serif;font-weight:300;line-height:1.6}
  img{width:200px;max-width:70vw;height:auto;margin:0 auto 36px;display:block}
  h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:clamp(48px,10vw,96px);line-height:.95;letter-spacing:.01em;text-transform:uppercase}
  h1 span{color:#c9a15c}
  p{margin:18px auto 34px;max-width:46ch;color:#c9c2b8}
  .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;padding:15px 26px;border:1px solid #c9a15c;border-radius:3px;color:#c9a15c;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
  a.btn.solid{background:#c9a15c;color:#060a0c}
  a.btn:hover,a.btn:focus-visible{background:#fff;border-color:#fff;color:#060a0c}
</style>
</head>
<body>
<main>
  <img src="/img/logo-media-mansion-header.webp" width="320" height="155" alt="Media Mansion">
  <h1>Page <span>not found</span></h1>
  <p>That page doesn't exist or has moved. Head back to the homepage, or get a price for your next shoot in about 30 seconds.</p>
  <div class="row">
    <a class="btn solid" href="/">Back to home</a>
    <a class="btn" href="/quote/">Get an instant quote</a>
  </div>
</main>
</body>
</html>
